name: Publicar video (Zona de Vuelo)

on:
  schedule:
    # 01:00 UTC = 03:00 Madrid (verano) / 02:00 Madrid (invierno). Con ~3h de produccion,
    # el video queda LISTO para descargar sobre las 05:00-06:00 Madrid, antes de las 8:00.
    - cron: "0 1 * * *"
  workflow_dispatch:         # boton para lanzarlo a mano (pruebas)
    inputs:
      idea:
        description: "Idea concreta a producir (si se deja vacio, usa la siguiente de la cola)"
        required: false
        default: ""

permissions:
  contents: write            # para guardar el puntero de la cola (queue/state.json)

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Dependencias del sistema (FFmpeg + libs de Chrome)
        timeout-minutes: 22          # margen; con `timeout` por comando ningun apt bloquea de verdad
        env:
          DEBIAN_FRONTEND: noninteractive   # nunca esperar respuesta interactiva
          NEEDRESTART_MODE: a               # needrestart en automatico (no pregunta)
          PKGS: >-
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 libxrandr2
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0
            libpango-1.0-0 libcairo2 libcups2
          # aborta cualquier descarga estancada a los 25s y reintenta (mirror Azure a veces se atasca)
          APTOPTS: -y --no-install-recommends -o Acquire::Retries=6 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25
        run: |
          set -u
          # 1) ffmpeg+ffprobe estaticos PRIMERO desde CDN (independiente de apt/mirror Ubuntu).
          #    Ambos binarios: los builds BtbN (GitHub CDN) y johnvansickle incluyen ffmpeg Y ffprobe.
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            for u in \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" ; do
              echo ">> ffmpeg desde $u"
              if curl -fsSL --retry 5 --retry-all-errors --max-time 240 "$u" -o /tmp/ff.tar.xz \
                 && mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1; then
                FF=$(find /tmp/ff -name ffmpeg -type f | head -1)
                FP=$(find /tmp/ff -name ffprobe -type f | head -1)
                [ -n "$FF" ] && [ -n "$FP" ] && sudo install -m755 "$FF" /usr/local/bin/ffmpeg \
                  && sudo install -m755 "$FP" /usr/local/bin/ffprobe && break
              fi
            done
          fi
          hash -r
          ffmpeg  -version | head -1 || { echo "ffmpeg NO disponible";  exit 1; }
          ffprobe -version | head -1 || { echo "ffprobe NO disponible"; exit 1; }

          # 2) libs de Chrome (best-effort): el runner ubuntu-latest ya trae Google Chrome y casi
          #    todas estas libs. Intentamos instalarlas por si falta alguna, con `timeout` para que
          #    un cuelgue del mirror se MATE (no bloquee) y SIN tumbar el job si apt no responde.
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null || true
          for try in 1 2 3; do
            echo "== apt libs Chrome, intento $try =="
            sudo timeout 90 apt-get update $APTOPTS >/dev/null 2>&1 || echo "  (update excedio 90s, sigo)"
            if sudo timeout 150 apt-get install $APTOPTS --fix-missing $PKGS; then
              echo "Chrome libs: instaladas"; break
            fi
            echo "  intento $try sin exito, reintento en 6s"; sleep 6
          done
          echo "Fin dependencias (ffmpeg garantizado; libs Chrome best-effort)."

      - name: Instalar Node + Python deps
        run: |
          npm install
          npx remotion browser ensure
          pip install -r requirements.txt

      - name: Producir el video
        id: producir
        env:
          GENAIPRO_API_KEY: ${{ secrets.GENAIPRO_API_KEY }}
          GENAIPRO_BASE: https://genaipro.io/api
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VIDEOS_DIR: ./salidas
        run: |
          set -eo pipefail
          IDEA_INPUT="${{ github.event.inputs.idea }}"
          if [ -n "$IDEA_INPUT" ]; then
            IDEA="$IDEA_INPUT"                 # idea concreta pedida a mano (no toca la cola)
            echo "Idea a demanda: $IDEA"
          else
            if ! IDEA=$(python scripts/pick_next_idea.py); then
              echo "No quedan ideas en la cola."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "Idea de la cola: $IDEA"
          fi
          python scripts/produce.py "$IDEA" | tee produce.log
          echo "video=$(grep '^VIDEO::' produce.log | tail -1 | sed 's/^VIDEO:://')" >> "$GITHUB_OUTPUT"
          echo "meta=$(grep '^META::'  produce.log | tail -1 | sed 's/^META:://')"  >> "$GITHUB_OUTPUT"

      - name: Guardar el video como artefacto (descargable)
        if: steps.producir.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: video-zona-de-vuelo
          path: salidas/*
          if-no-files-found: error

      - name: Publicar en YouTube (si esta configurado)
        if: ${{ env.HAS_YT != '' && steps.producir.outputs.skip != '1' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py "${{ steps.producir.outputs.video }}" "${{ steps.producir.outputs.meta }}" public

      - name: Avanzar la cola (SOLO si el video salio bien y se uso la cola)
        # success() => todos los pasos anteriores OK (incluida la subida del artefacto).
        # !inputs.idea => fue un run de la cola (schedule o boton sin idea), no una idea a demanda.
        # Asi, un run fallido NUNCA consume una idea.
        if: ${{ success() && steps.producir.outputs.skip != '1' && !github.event.inputs.idea }}
        run: |
          python scripts/advance_queue.py
          git config user.name "zona-de-vuelo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue/state.json
          git commit -m "avanzar cola: video publicado" || echo "sin cambios"
          git push || echo "nada que empujar"
