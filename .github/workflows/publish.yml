name: Publicar video (Zona de Vuelo)

on:
  schedule:
    - cron: "0 9 * * *"     # cada dia a las 09:00 UTC (cambia aqui la cadencia)
  workflow_dispatch:         # boton para lanzarlo a mano (pruebas)

permissions:
  contents: write            # para guardar el puntero de la cola (queue/state.json)

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HAS_YT: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Dependencias del sistema (FFmpeg + libs de Chrome)
        timeout-minutes: 18          # si apt se cuelga pese a los reintentos, falla rapido
        env:
          DEBIAN_FRONTEND: noninteractive   # nunca esperar respuesta interactiva
          NEEDRESTART_MODE: a               # needrestart en automatico (no pregunta)
          PKGS: >-
            libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 libxrandr2
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0
            libpango-1.0-0 libcairo2 libcups2
          # aborta cualquier descarga estancada a los 25s y reintenta (mirror Azure a veces se atasca)
          APTOPTS: -y --no-install-recommends -o Acquire::Retries=6 -o Acquire::http::Timeout=25 -o Acquire::https::Timeout=25
        run: |
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock 2>/dev/null || true
          sudo apt-get update -o Acquire::Retries=6 -o Acquire::http::Timeout=25 || true
          # ffmpeg via binario estatico (evita descargar libcodec2/librav1e/etc del mirror lento)
          if ! command -v ffmpeg >/dev/null; then
            for u in \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" \
              "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-linux-x64" ; do
              echo "Bajando ffmpeg de $u"
              if [ "${u##*.}" = "xz" ]; then
                curl -fsSL --retry 5 --retry-all-errors --max-time 180 "$u" -o /tmp/ff.tar.xz \
                  && mkdir -p /tmp/ff && tar -xf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1 \
                  && sudo cp /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/ && break
              else
                curl -fsSL --retry 5 --retry-all-errors --max-time 180 "$u" -o /usr/local/bin/ffmpeg \
                  && sudo chmod +x /usr/local/bin/ffmpeg && break
              fi
            done
          fi
          # librerias de Chrome (paquetes pequeños) con reintentos; si un intento se atasca, repetimos
          for try in 1 2 3; do
            echo "== intento apt install libs Chrome ($try) =="
            sudo apt-get install $APTOPTS $PKGS && break
            echo "fallo intento $try, reintento..."; sleep 5
          done
          ffmpeg -version | head -1
          echo "Chrome libs: OK"

      - name: Instalar Node + Python deps
        run: |
          npm install
          npx remotion browser ensure
          pip install -r requirements.txt

      - name: Producir el video
        id: producir
        env:
          GENAIPRO_API_KEY: ${{ secrets.GENAIPRO_API_KEY }}
          GENAIPRO_BASE: https://genaipro.io/api
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          VIDEOS_DIR: ./salidas
        run: |
          set -eo pipefail
          if ! IDEA=$(python scripts/pick_next_idea.py); then
            echo "No quedan ideas en la cola."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "Idea de hoy: $IDEA"
          python scripts/produce.py "$IDEA" | tee produce.log
          echo "video=$(grep '^VIDEO::' produce.log | tail -1 | sed 's/^VIDEO:://')" >> "$GITHUB_OUTPUT"
          echo "meta=$(grep '^META::'  produce.log | tail -1 | sed 's/^META:://')"  >> "$GITHUB_OUTPUT"

      - name: Guardar el video como artefacto (descargable)
        if: steps.producir.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: video-zona-de-vuelo
          path: salidas/*
          if-no-files-found: error

      - name: Publicar en YouTube (si esta configurado)
        if: ${{ env.HAS_YT != '' && steps.producir.outputs.skip != '1' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py "${{ steps.producir.outputs.video }}" "${{ steps.producir.outputs.meta }}" public

      - name: Guardar el puntero de la cola
        if: always()
        run: |
          git config user.name "zona-de-vuelo-bot"
          git config user.email "bot@users.noreply.github.com"
          git add queue/state.json || true
          git commit -m "avanzar cola de ideas" || echo "sin cambios"
          git push || echo "nada que empujar"
